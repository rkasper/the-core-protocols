<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="home">
{% include header.html %}
<section class="home-hero">
  <div class="wrap home-hero-inner">
    <div class="home-hero-text">
      <h1 class="cover-title">{{ page.title_top }}<span>{{ page.title_bottom }}</span></h1>
      <p class="cover-sub">{{ page.subtitle }}</p>
    </div>
    <img class="home-hero-art" src="{{ '/assets/images/people.png' | relative_url }}" alt="" width="450" height="312">
  </div>
</section>
<div class="cover-band"><div class="wrap">{{ page.band }}</div></div>
<main class="wrap">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
