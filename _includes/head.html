<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.url == "/" %}{% assign full_title = site.title %}{% elsif page.url == "/es/" %}{% assign full_title = "Los protocolos fundamentales" %}{% else %}{% assign full_title = page.title | append: " · " | append: site.title %}{% endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<meta property="og:title" content="{{ full_title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:image" content="{{ site.url }}/assets/images/book-cover.jpg">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
